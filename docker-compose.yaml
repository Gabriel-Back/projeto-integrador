services:
  db:
    image: mysql:8.4
    container_name: mysql-projeto-integrador
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: projeto-integrador
      MYSQL_USER: semaforo
      MYSQL_PASSWORD: semaforo123
    ports:
      - "3336:3306"
    volumes:
      - mysql_data:/var/lib/mysql
volumes:
  mysql_data:
    driver: local
